services:

  backend:
    build:
      context: ../services/backend
      dockerfile: docker/php/Dockerfile

    container_name: ai-platform-backend

    expose:
      - "9000"

    volumes:
      - ../services/backend:/var/www/html

    working_dir: /var/www/html

    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in infra/.env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in infra/.env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in infra/.env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TRUSTED_PROXIES: private_ranges
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-ai_platform}?serverVersion=17&charset=utf8
      MAILER_DSN: null://null
      MAILER_FROM: assistant@example.com

    depends_on:
      - postgres
      - ai-orchestrator

  nginx:
    image: nginx:alpine

    container_name: ai-platform-nginx

    ports:
      - "8080:80"

    volumes:
      - ../services/backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg17

    container_name: ai-platform-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-orchestrator:
    build:
      context: ..
      dockerfile: services/ai-orchestrator/Dockerfile

    container_name: ai-orchestrator

    expose:
      - "3000"

    volumes:
      - ../services/ai-orchestrator:/repo/services/ai-orchestrator
      - ../shared:/repo/shared
      - ai_orchestrator_node_modules:/repo/services/ai-orchestrator/node_modules

    working_dir: /repo/services/ai-orchestrator

    environment:
      BACKEND_URL: http://nginx
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in infra/.env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

  lead-widget:
    build:
      context: ..
      dockerfile: services/lead-widget/Dockerfile

    container_name: lead-widget

    ports:
      - "3001:3001"

    volumes:
      - ../services/lead-widget:/repo/services/lead-widget
      - ../shared:/repo/shared
      - lead_widget_node_modules:/repo/services/lead-widget/node_modules

    working_dir: /repo/services/lead-widget

    environment:
      PORT: 3001
      BACKEND_URL: http://nginx
      WIDGET_URL: http://localhost:3001
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in infra/.env}

volumes:
  postgres_data:
  ai_orchestrator_node_modules:
  lead_widget_node_modules: